# Minimal Headscale config for a throwaway, offline test tailnet.
# Nodes reach the control server over the compose network at headscale:8443.
# TLS uses a throwaway local CA generated by scripts/up.sh (certs/).
server_url: https://headscale:8443
listen_addr: 0.0.0.0:8443
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Embedded DERP relay + STUN, served by headscale itself (needs TLS).
# No public DERP map: the test world stays offline. Tailscale clients use DERP
# to bootstrap the disco handshake, so without a reachable relay even nodes on
# the same LAN take ~a minute to find each other.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "world"
    region_name: "msw embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false

disable_check_updates: true

tls_cert_path: /certs/headscale.crt
tls_key_path: /certs/headscale.key

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 2m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: world.test
  override_local_dns: false
  nameservers:
    global: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
